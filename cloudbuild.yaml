# Secret keys aren't in the uploaded .env.deploy; they're appended here from Secret Manager.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["FIREBASE_PRIVATE_KEY", "GEMINI_API_KEY"]
    args:
      - -c
      - |
        printf 'FIREBASE_PRIVATE_KEY="%s"\nGEMINI_API_KEY="%s"\n' "$$FIREBASE_PRIVATE_KEY" "$$GEMINI_API_KEY" >> .env.deploy
        docker build --secret id=dotenv,src=.env.deploy -t "${_IMAGE}" .
images: ["${_IMAGE}"]
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/auntified-firebase-private-key/versions/latest
      env: FIREBASE_PRIVATE_KEY
    - versionName: projects/$PROJECT_ID/secrets/auntified-gemini-api-key/versions/latest
      env: GEMINI_API_KEY
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
