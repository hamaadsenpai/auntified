# Used by the GitHub push trigger on main and by scripts/deploy.sh.
# Config is in the committed .env.production; the secret keys come from Secret Manager
# (build: below; runtime: set on the Cloud Run service, which `update --image` keeps).
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["FIREBASE_PRIVATE_KEY", "GEMINI_API_KEY"]
    args:
      - -c
      - |
        printf 'FIREBASE_PRIVATE_KEY="%s"\nGEMINI_API_KEY="%s"\n' "$$FIREBASE_PRIVATE_KEY" "$$GEMINI_API_KEY" > /workspace/build-secrets.env
        docker build --secret id=dotenv,src=/workspace/build-secrets.env -t "${_IMAGE}:$BUILD_ID" .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:$BUILD_ID"]
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - auntified
      - --region=asia-south1
      - --image=${_IMAGE}:$BUILD_ID
      - --quiet
images: ["${_IMAGE}:$BUILD_ID"]
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/auntified
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/auntified-firebase-private-key/versions/latest
      env: FIREBASE_PRIVATE_KEY
    - versionName: projects/$PROJECT_ID/secrets/auntified-gemini-api-key/versions/latest
      env: GEMINI_API_KEY
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  substitutionOption: ALLOW_LOOSE
